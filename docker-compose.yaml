services:
  mariadb:
    image: mariadb:lts
    container_name: sysportdb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DB: ${DB_NAME}

    ports:
        - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - sysport-network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  sysport-network:
    driver: bridge
